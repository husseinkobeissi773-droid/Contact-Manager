<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style3.css">
  <title>Phonebook App</title>
</head>
<body>
  <h1>Phonebook</h1>

  <div class="add">
    <h2>Add Contact</h2>
    <input type="text" id="fname" placeholder="First Name"><br><br>
    <input type="text" id="lname" placeholder="Last Name"><br><br>
    <input type="text" id="phone" placeholder="Phone"><br><br>
    <input type="text" id="email" placeholder="Email"><br><br>
    <input type="text" id="address" placeholder="Address"><br><br>
    <button onclick="addContact()">Add Contact</button><BR></BR>

    <button onclick="listContacts()">List Contacts</button><br><br>
    <button onclick="viewContact()">View Contact</button><br><br>
    <button onclick="editContact()">Edit Contact</button><br><br>
    <button onclick="deleteContact()">Delete Contact</button><br><br>
  
    <p id="result"></p>
  </div>

  <br>

 

  <script src="script1.js"> </script>
 
</body>
</html>
